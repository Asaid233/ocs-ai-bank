<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCS 题库 · DeepSeek AI 答题</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 4.5h9.2L19 8.3v11.2H6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M9 11h7M9 14h7M9 17h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M14.6 4.6v4h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">OCS 题库</div>
          <div class="brand-sub">DeepSeek + 言溪题库</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/overview" data-view="overview">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 13.5h6V20H4zM14 4h6v16h-6zM4 4h6v6H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span>概览</span>
        </a>
        <a class="nav-item" href="#/bank" data-view="bank">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6.5c0-1.1 3.6-2 8-2s8 .9 8 2-3.6 2-8 2-8-.9-8-2Z" stroke="currentColor" stroke-width="1.6"/><path d="M4 6.5v11c0 1.1 3.6 2 8 2s8-.9 8-2v-11" stroke="currentColor" stroke-width="1.6"/><path d="M4 12c0 1.1 3.6 2 8 2s8-.9 8-2" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>题库</span>
          <span class="nav-count" id="nav-count">0</span>
        </a>
        <a class="nav-item" href="#/settings" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5a7.8 7.8 0 0 0 .05-3l-2.1-.5a5.9 5.9 0 0 0-.7-1.7l1.1-1.8-2.1-2.1-1.8 1.1a5.9 5.9 0 0 0-1.7-.7L12.6 2.7h-3l-.5 2.1a5.9 5.9 0 0 0-1.7.7L5.6 4.4 3.5 6.5l1.1 1.8a5.9 5.9 0 0 0-.7 1.7l-2.1.5a7.8 7.8 0 0 0 0 3l2.1.5c.16.6.4 1.17.7 1.7l-1.1 1.8 2.1 2.1 1.8-1.1c.54.3 1.1.54 1.7.7l.5 2.1h3l.5-2.1a5.9 5.9 0 0 0 1.7-.7l1.8 1.1 2.1-2.1-1.1-1.8c.3-.53.54-1.1.7-1.7l2.1-.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>设置</span>
        </a>
        <a class="nav-item" href="#/guide" data-view="guide">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5v-15Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5A2.5 2.5 0 0 1 5 20.5Z" stroke="currentColor" stroke-width="1.6"/><path d="M9 7h6M9 10.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>使用指南</span>
        </a>
      </nav>

      <div class="side-card" id="side-card">
        <div class="side-row">
          <span class="dot dot-idle" id="side-dot"></span>
          <span id="side-status">正在连接服务…</span>
        </div>
        <div class="side-meta" id="side-model">—</div>
        <a class="side-link" href="#/settings">配置 DeepSeek <span>→</span></a>
      </div>

      <div class="side-foot">本地运行 · v1.0.0</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">概览</h1>
          <p id="page-sub">本地题库优先，言溪次之，最后交给 DeepSeek</p>
        </div>
        <div class="top-actions">
          <button class="btn ghost sm" id="btn-copy-config">
            <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="10" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M15 5.5A1.5 1.5 0 0 0 13.5 4h-8A1.5 1.5 0 0 0 4 5.5v10A1.5 1.5 0 0 0 5.5 17" stroke="currentColor" stroke-width="1.6"/></svg>
            复制 OCS 配置
          </button>
          <span class="pill" id="ai-pill"><span class="dot dot-idle"></span>检查中</span>
        </div>
      </header>

      <section class="view" id="view"></section>
    </main>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>
  <div id="modal-root"></div>

  <script src="/app.js"></script>
</body>
</html>
